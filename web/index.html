<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pentest Lead Finder</title>
<style>
:root{
  --bg:#0a0d11; --panel:#0f1318; --panel2:#141920; --line:#28313d; --line2:#37424f;
  --text:#e6edf3; --muted:#78838f; --accent:#3fb950; --accent2:#2f81f7; --violet:#8957e5;
  --red:#f85149; --yellow:#d29922; --green:#3fb950; --chip:#141920;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--mono)}
a{color:var(--accent2);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1400px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.logo{color:var(--accent)}
.stats{display:flex;gap:0;flex-wrap:wrap;margin-left:auto;border:1px solid var(--line)}
.stat{background:var(--panel);border-right:1px solid var(--line);padding:6px 12px;font-size:12px}
.stat:last-child{border-right:none}
.stat b{font-size:15px;color:var(--text);font-family:var(--mono)} .stat span{color:var(--muted)}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:14px}
.searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--line2);color:var(--text);
  padding:10px 12px;border-radius:2px;font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--accent2)}
button{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:9px 14px;border-radius:2px;
  cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.3px;transition:.12s}
button:hover{border-color:var(--accent2);background:#1a222c}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.primary:hover{background:#2673d9}
button.super{background:transparent;border-color:var(--violet);color:#b78bf5}
button.super:hover{background:rgba(137,87,229,.12)}
button.ghost{background:transparent;border-color:var(--line)}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.idea{background:var(--chip);border:1px solid var(--line);border-radius:2px;padding:5px 11px;font-size:12px;cursor:pointer}
.idea:hover{border-color:var(--accent);color:var(--accent)}
.progress{margin-top:12px;display:none}
.progress.show{display:block}
.track{height:6px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--accent2);width:0%;transition:width .4s}
.ptext{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:10px;font-family:var(--mono)}
.log{margin-top:10px;background:#070a0d;border:1px solid var(--line);border-radius:2px;padding:8px 10px;
  max-height:190px;overflow-y:auto;font-family:var(--mono);font-size:11px;line-height:1.55;scroll-behavior:smooth}
.log div{white-space:pre-wrap;word-break:break-all}
.log .l-sys{color:var(--accent2)}
.log .l-target{color:var(--green);font-weight:700}
.log .l-skip{color:var(--muted)}
.log .l-err{color:var(--red)}
.log .l-head{color:var(--violet)}
.log .caret{color:var(--accent);animation:blink 1.1s steps(1) infinite}
.log .spin{color:var(--accent);font-weight:700;display:inline-block;width:1ch;text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:2px;padding:6px 12px;font-size:12px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--line2)}
.chip.active{background:transparent;border-color:var(--accent2);color:var(--accent2)}
.spacer{flex:1}
select{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:7px 10px;border-radius:2px;font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.6px;cursor:pointer;
  white-space:nowrap;background:var(--panel2);border-bottom:1px solid var(--line2)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td .name{font-weight:600} td .dom{color:var(--muted);font-size:12px;font-family:var(--mono)}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:700;font-family:var(--mono)}
.b-green{background:rgba(63,185,80,.10);color:#56d364;border:1px solid rgba(63,185,80,.35)}
.b-yellow{background:rgba(210,153,34,.10);color:#e3b341;border:1px solid rgba(210,153,34,.35)}
.b-red{background:rgba(248,81,73,.10);color:#ff7b72;border:1px solid rgba(248,81,73,.35)}
.b-gray{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.b-blue{background:rgba(47,129,247,.10);color:#6cb6ff;border:1px solid rgba(47,129,247,.35)}
.empty{text-align:center;color:var(--muted);padding:40px}
/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:-560px;width:540px;max-width:92vw;height:100%;background:var(--panel);
  border-left:1px solid var(--line2);z-index:11;transition:right .2s;overflow-y:auto;padding:20px}
.drawer.show{right:0}
.drawer h2{margin:0 0 2px;font-size:17px}
.drawer .dom{color:var(--muted);font-size:13px;margin-bottom:14px;display:block;font-family:var(--mono)}
.row{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row .k{color:var(--muted);width:150px;flex-shrink:0;text-transform:uppercase;font-size:11px;letter-spacing:.3px;padding-top:1px}
.row .v{flex:1}
.pitch{background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--accent2);border-radius:2px;padding:12px;margin-top:12px;white-space:pre-wrap;font-size:13px}
.close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.copy{margin-top:8px}
.tag{display:inline-block;background:var(--chip);border:1px solid var(--line2);border-radius:2px;padding:2px 7px;margin:2px 3px 2px 0;font-size:11px;font-family:var(--mono)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
.tablewrap table{border:none}
td[data-label]::before{content:none}
/* icons + terminal */
.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:0 0 auto}
button,.chip,.idea,.stat{display:inline-flex;align-items:center;gap:7px}
h1{display:flex;align-items:center;gap:8px}
h1 .ic{width:16px;height:16px;color:var(--accent)}
.cursor{display:inline-block;width:8px;height:14px;background:var(--accent);animation:blink 1.1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.prompt{color:var(--accent);font-family:var(--mono);font-weight:700;user-select:none}
.stat .ic{width:12px;height:12px;color:var(--muted)}
.chip .ic,.idea .ic{color:var(--muted)}
.chip.active .ic{color:var(--accent2)}
.b-green .ic,.b-yellow .ic,.b-red .ic,.b-gray .ic{width:11px;height:11px}

/* ---------- Mobile: table becomes cards ---------- */
@media (max-width:640px){
  .wrap{padding:12px}
  header{gap:10px}
  h1{font-size:15px}
  .stats{margin-left:0;width:100%}
  .stat{flex:1;min-width:0;text-align:center;padding:6px 4px}
  .searchrow{gap:6px}
  .searchrow input[type=text]{flex:1 1 100%;min-width:0}
  .searchrow button{flex:1}
  .filters .spacer{display:none}
  #sort,.filters button{flex:1}
  .drawer{width:100%;max-width:100%;padding:16px}
  .row .k{width:120px}
  .tablewrap{overflow-x:visible;border:none}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  table{border:none;background:transparent}
  tbody tr{margin-bottom:8px;border:1px solid var(--line);border-radius:2px;background:var(--panel);padding:10px 12px}
  tbody tr:last-child td{border-bottom:none}
  td{border:none;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  td.cell-main{display:block;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  td.empty{display:block;justify-content:center}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
<symbol id="i-dollar" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16"/><polyline points="22,6 12,13 2,6"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
</defs></svg>
<div class="wrap">
  <header>
    <h1><svg class="ic"><use href="#i-terminal"/></svg>pentest-lead-finder<span class="cursor"></span></h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <div class="searchrow">
      <span class="prompt">&gt;</span>
      <input type="text" id="q" placeholder="ниша: интернет-магазин москва, онлайн-школа, клиника…"
             onkeydown="if(event.key==='Enter')runSearch(false)">
      <button class="primary" onclick="runSearch(false)"><svg class="ic"><use href="#i-search"/></svg>найти</button>
      <button onclick="runSearch(true)" title="Глубокий поиск (до 80 сайтов)"><svg class="ic"><use href="#i-layers"/></svg>глубокий</button>
      <button class="ghost" onclick="loadIdeas()"><svg class="ic"><use href="#i-zap"/></svg>идея</button>
      <button class="super" onclick="runSuper()"><svg class="ic"><use href="#i-activity"/></svg>super_scan</button>
    </div>
    <div class="ideas" id="ideas"></div>
    <div class="progress" id="progress">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="ptext"><span id="ptext">…</span><button class="ghost" style="padding:2px 8px" onclick="cancelJob()">стоп</button></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="filters" id="filters">
    <div class="chip active" data-f="" onclick="setFilter(this)"><svg class="ic"><use href="#i-list"/></svg>все</div>
    <div class="chip" data-f="auth" onclick="setFilter(this)"><svg class="ic"><use href="#i-lock"/></svg>авторизация</div>
    <div class="chip" data-f="bb" onclick="setFilter(this)"><svg class="ic"><use href="#i-flag"/></svg>bug_bounty</div>
    <div class="chip" data-f="nobb" onclick="setFilter(this)"><svg class="ic"><use href="#i-target"/></svg>без_bb</div>
    <div class="chip" data-f="rich" onclick="setFilter(this)"><svg class="ic"><use href="#i-dollar"/></svg>платёжеспособные</div>
    <div class="chip" data-f="hot" onclick="setFilter(this)"><svg class="ic"><use href="#i-flame"/></svg>горячие</div>
    <div class="chip" data-f="email" onclick="setFilter(this)"><svg class="ic"><use href="#i-mail"/></svg>email</div>
    <div class="spacer"></div>
    <select id="sort" onchange="loadCompanies()">
      <option value="surface_score">sort: поверхность</option>
      <option value="payout_score">sort: платёжеспособность</option>
      <option value="quality_score">sort: пентест-лид</option>
      <option value="hotness_score">sort: горячесть</option>
    </select>
    <button onclick="doExport()"><svg class="ic"><use href="#i-download"/></svg>export.xlsx</button>
  </div>

  <div class="tablewrap">
  <table>
    <thead><tr>
      <th onclick="sortBy('name')">Компания</th>
      <th onclick="sortBy('surface_score')">Поверхность</th>
      <th onclick="sortBy('payout_score')">Платёж</th>
      <th>Bug bounty</th>
      <th>Данные</th>
      <th onclick="sortBy('quality_score')">Лид</th>
    </tr></thead>
    <tbody id="rows"><tr><td class="empty" colspan="6">// база пуста — запусти поиск</td></tr></tbody>
  </table>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
let FILTER="", SORT="surface_score", ORDER="desc", JOB=null, TIMER=null;
let SPIN=0, SPINT=null; const SPINNER=['\\','|','/','-'];
function startSpin(){stopSpin();SPINT=setInterval(()=>{SPIN=(SPIN+1)%SPINNER.length;const s=document.getElementById('spin');if(s)s.textContent=SPINNER[SPIN];},120);}
function stopSpin(){if(SPINT)clearInterval(SPINT);SPINT=null;}

function qs(){const f={}; if(FILTER)f[FILTER]=1; const q=document.getElementById('q').value.trim(); if(q&&JOB===null)f.q=""; f.sort=document.getElementById('sort').value; f.order=ORDER; return f;}
function params(extra){const f=Object.assign({},extra||{}); if(FILTER)f[FILTER]=1; return new URLSearchParams(f).toString();}

async function loadDashboard(){
  const d=await (await fetch('/api/dashboard')).json();
  document.getElementById('stats').innerHTML=[
    ['','всего',d.total],['i-lock','auth',d.with_auth],['i-flag','bb',d.with_bb],
    ['i-flame','hot',d.hot],['i-mail','email',d.with_email]
  ].map(([ic,k,v])=>`<div class="stat">${ic?`<svg class="ic"><use href="#${ic}"/></svg>`:''}<b>${v??0}</b> <span>${k}</span></div>`).join('');
}

function surfB(s){s=s||0;const c=s>=70?'b-green':s>=40?'b-yellow':'b-gray';return `<span class="badge ${c}">${s}/100</span>`;}
function payB(s){s=s||0;const c=s>=7?'b-green':s>=4?'b-yellow':s>=1?'b-red':'b-gray';const t=s>=7?'высокая':s>=4?'средняя':s>=1?'низкая':'—';return `<span class="badge ${c}">${t} ${s?('· '+s):''}</span>`;}
function bbB(c){if(c.has_bb){const p=(c.bb_platforms||[]).join(', ')||'да';return `<span class="badge b-green">${p}</span>`;}return '<span class="badge b-gray">нет</span>';}
function sensB(v){const c=v==='high'?'b-red':v==='medium'?'b-yellow':'b-gray';const t=v==='high'?'высокая':v==='medium'?'средняя':v==='low'?'низкая':'—';return `<span class="badge ${c}">${t}</span>`;}
function leadB(s){s=s||0;const c=s>=7?'b-green':s>=4?'b-yellow':'b-gray';return `<span class="badge ${c}">${s}/10</span>`;}

async function loadCompanies(){
  SORT=document.getElementById('sort').value;
  const p=new URLSearchParams({sort:SORT,order:ORDER}); if(FILTER)p.set(FILTER,1);
  const d=await (await fetch('/api/companies?'+p)).json();
  const tb=document.getElementById('rows');
  if(!d.items.length){tb.innerHTML='<tr><td class="empty" colspan="6">// пусто под этим фильтром</td></tr>';return;}
  tb.innerHTML=d.items.map(c=>`<tr onclick="openDrawer('${c.domain}')">
    <td class="cell-main"><div class="name">${esc(c.name||c.domain)}</div><div class="dom">${esc(c.domain)}</div></td>
    <td data-label="Поверхность">${surfB(c.surface_score)}</td>
    <td data-label="Платёж">${payB(c.payout_score)}</td>
    <td data-label="Bug bounty">${bbB(c)}</td>
    <td data-label="Данные">${sensB(c.data_sensitivity)}</td>
    <td data-label="Лид">${leadB(c.quality_score)}</td>
  </tr>`).join('');
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

async function openDrawer(dom){
  const c=await (await fetch('/api/company/'+encodeURIComponent(dom))).json();
  const ct=c.contacts||{}, ch=c.channels||{};
  const dms=(c.decision_makers||[]).map(d=>`${esc(d.name)}${d.role?' ('+esc(d.role)+')':''}${d.contact?' — '+esc(d.contact):''}`).join('<br>')||'—';
  const surf=(c.attack_surface||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'—';
  const stack=(c.stack||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'—';
  const bb=c.has_bb?`ЕСТЬ${(c.bb_platforms||[]).length?' ('+esc(c.bb_platforms.join(', '))+')':''}${c.bb_url?` · <a href="${esc(c.bb_url)}" target="_blank">ссылка</a>`:''}`:'нет';
  const row=(k,v)=>`<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  document.getElementById('drawer').innerHTML=`
    <button class="close" onclick="closeDrawer()"><svg class="ic" style="width:18px;height:18px"><use href="#i-x"/></svg></button>
    <h2>${esc(c.name||c.domain)}</h2>
    <span class="dom"><a href="${esc(c.url||('https://'+c.domain))}" target="_blank">${esc(c.domain)}</a></span>
    ${row('Описание',esc(c.description||'—'))}
    ${row('Поверхность атаки',surf+` <b>${c.surface_score||0}/100</b>`)}
    ${row('Bug bounty',bb)}
    ${row('Платёжеспособность',payB(c.payout_score)+' '+esc(c.payout_reason||''))}
    ${row('Данные',sensB(c.data_sensitivity))}
    ${row('Пентест-лид',leadB(c.quality_score))}
    ${row('Горячесть',(c.hotness_score||0)+'/100')}
    ${row('Стек',stack)}
    ${row('Бэкенд',esc(c.backend_type||'—')+' · '+esc(c.size||''))}
    ${row('ЛПР',dms)}
    ${row('Email',esc((ct.emails||[]).join(', ')||'—'))}
    ${row('Телефоны',esc((ct.phones||[]).join(', ')||'—'))}
    ${row('Telegram',esc((ch.telegram||[]).join(', ')||'—'))}
    ${row('Что проверить',esc(c.needs||'—'))}
    <div style="margin-top:14px;color:var(--muted);font-size:12px">// питч для холодного оффера</div>
    <div class="pitch" id="pitchtext">${esc(c.pitch||'—')}</div>
    <button class="copy" onclick="copyPitch()"><svg class="ic"><use href="#i-copy"/></svg>копировать</button>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function copyPitch(){navigator.clipboard.writeText(document.getElementById('pitchtext').innerText);}
function closeDrawer(){document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('show');}

function setFilter(el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');FILTER=el.dataset.f;loadCompanies();}
function sortBy(col){if(SORT===col)ORDER=(ORDER==='desc'?'asc':'desc');else{SORT=col;ORDER='desc';}document.getElementById('sort').value=['surface_score','payout_score','quality_score','hotness_score'].includes(col)?col:document.getElementById('sort').value;loadCompanies();}
function doExport(){const p=new URLSearchParams();if(FILTER)p.set(FILTER,1);window.location='/api/export?'+p;}

async function loadIdeas(){
  const box=document.getElementById('ideas');box.innerHTML='<span style="color:var(--muted);font-size:12px">генерирую…</span>';
  const d=await (await fetch('/api/ideas?n=6')).json();
  box.innerHTML=(d.ideas||[]).map(i=>`<span class="idea" onclick="pick('${esc(i).replace(/'/g,"\\'")}')"><svg class="ic"><use href="#i-search"/></svg>${esc(i)}</span>`).join('')
    +' <span class="idea" onclick="loadIdeas()"><svg class="ic"><use href="#i-zap"/></svg>ещё</span>';
}
function pick(q){const el=document.getElementById('q');el.value=q;el.focus();}

async function runSearch(deep){
  const q=document.getElementById('q').value.trim(); if(!q)return;
  const r=await (await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,deep})})).json();
  startJob(r.job_id);
}
async function runSuper(){const r=await (await fetch('/api/superscan',{method:'POST'})).json();startJob(r.job_id);}
function cancelJob(){if(JOB)fetch('/api/job/'+JOB+'/cancel',{method:'POST'});}

function startJob(jid){
  JOB=jid;document.getElementById('progress').classList.add('show');
  document.getElementById('log').innerHTML='';document.getElementById('fill').style.width='0%';
  if(TIMER)clearInterval(TIMER);
  startSpin();
  TIMER=setInterval(pollJob,1200);pollJob();
}
function logClass(l){
  if(l.includes('-> TARGET'))return 'l-target';
  if(l[0]==='!'||l.includes(':: error'))return 'l-err';
  if(l[0]==='=')return 'l-head';
  if(l[0]==='$'||l[0]==='>')return 'l-sys';
  return 'l-skip';
}
function renderLog(lines,done){
  const el=document.getElementById('log');
  const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;
  let html=lines.map(l=>`<div class="${logClass(l)}">${esc(l)}</div>`).join('');
  if(!done)html+=`<div class="l-sys">&gt;&nbsp;<span class="spin" id="spin">${SPINNER[SPIN]}</span> scanning…</div>`;
  el.innerHTML=html;
  if(atBottom||done)el.scrollTop=el.scrollHeight;
}
async function pollJob(){
  if(!JOB)return;
  const j=await (await fetch('/api/job/'+JOB)).json();
  const p=j.progress||{};
  let pct=0,txt='';
  if(p.phase==='superscan'){pct=p.niche_total?Math.round(p.niche/p.niche_total*100):0;
    txt=`[super] niche ${p.niche||0}/${p.niche_total||'?'} :: ${p.query||''} :: targets=${p.good||0} done=${p.done||0}`;}
  else{const tot=p.pending||p.total||1;pct=Math.min(100,Math.round((p.done||0)/tot*100));
    txt=`${p.query||''} :: targets=${p.good||0} done=${p.done||0}/${p.pending||'?'} no_auth=${p.no_auth||0} landing=${p.landing||0}`;}
  document.getElementById('fill').style.width=(j.done?100:pct)+'%';
  document.getElementById('ptext').innerText=j.done?('done :: targets='+(p.good||0)):txt;
  renderLog(j.log||[],j.done);
  if(j.done){clearInterval(TIMER);stopSpin();JOB=null;loadCompanies();loadDashboard();}
}

loadDashboard();loadCompanies();
</script>
</body>
